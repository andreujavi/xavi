<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pirulo de Xavi - Live Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0b0f19; color: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 440px; height: 100%; max-height: 900px; display: flex; flex-direction: column; background: #111827; border-left: 1px solid rgba(255, 255, 255, 0.05); border-right: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); }
        .app-header { padding: 16px 20px; background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; }
        .app-title { font-size: 1.1rem; font-weight: 800; background: linear-gradient(135deg, #f59e0b, #d97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .live-badge { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); padding: 3px 8px; border-radius: 20px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
        .camera-section { position: relative; width: 100%; height: 38vh; background: #000; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        
        /* Local: Silenciado para evitar el eco en tus propios altavoces */
        #localVideo { width: 100%; height: 100%; object-fit: cover; background: #1a1a1a; }
        
        /* Remota: CON SONIDO (sin atributo muted) para escuchar al otro */
        #remoteVideo { position: absolute; bottom: 14px; right: 14px; width: 115px; height: 155px; object-fit: cover; border: 2px solid #f59e0b; border-radius: 12px; background: #222; box-shadow: 0 8px 20px rgba(0,0,0,0.7); z-index: 10; }
        .remote-label { position: absolute; bottom: 150px; right: 14px; background: rgba(245, 158, 11, 0.9); color: #0b0f19; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 4px; z-index: 11; text-transform: uppercase; }
        
        .chat-section { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0f172a; }
        .message { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 0.85rem; word-break: break-word; }
        .message.incoming { background: #1e293b; color: #e2e8f0; align-self: flex-start; border: 1px solid rgba(255, 255, 255, 0.04); }
        .message.outgoing { background: linear-gradient(135deg, #f59e0b, #d97706); color: #0b0f19; font-weight: 500; align-self: flex-end; }
        .controls-section { padding: 12px 16px; background: #111827; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .media-buttons { display: flex; justify-content: space-between; gap: 8px; }
        .media-buttons button { flex: 1; background: #1f2937; border: 1px solid rgba(255, 255, 255, 0.06); color: #cbd5e1; padding: 8px 6px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: 600; }
        .media-buttons button:hover { background: #374151; color: #fff; border-color: #f59e0b; }
        .chat-input-bar { display: flex; gap: 8px; }
        .chat-input-bar input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.08); background: #1f2937; color: #fff; font-size: 0.85rem; outline: none; }
        .chat-input-bar input:focus { border-color: #f59e0b; }
        .chat-input-bar button { padding: 10px 18px; background: #f59e0b; border: none; color: #0b0f19; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 class="app-title">🍸 El Pirulo de Xavi</h1>
            <span class="live-badge">● En Vivo</span>
        </header>

        <div class="camera-section">
            <!-- Tu cámara propia (silenciada para evitar eco en tus propios altavoces) -->
            <video id="localVideo" autoplay playsinline muted></video>
            <span class="remote-label">Remota</span>
            <!-- Cámara remota (CON AUDIO ACTIVO) -->
            <video id="remoteVideo" autoplay playsinline></video>
            <img id="remoteImageFallback" style="position:absolute; bottom:14px; right:14px; width:115px; height:155px; object-fit:cover; border:2px solid #f59e0b; border-radius:12px; display:none; z-index:10;" />
        </div>

        <div class="chat-section" id="chatSection">
            <div class="message incoming">¡Bienvenidos a El Pirulo de Xavi! 🚀 Haz clic en cualquier parte para activar el audio.</div>
        </div>

        <div class="controls-section">
            <div class="media-buttons">
                <button onclick="sendMedia('sticker')">👾 Sticker</button>
                <button onclick="sendMedia('video')">🎬 Vídeo</button>
                <button onclick="sendMedia('audio')">🎤 Audio</button>
            </div>
            <div class="chat-input-bar">
                <input type="text" id="messageInput" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const remoteImageFallback = document.getElementById('remoteImageFallback');
      let localStream, peerConnection, remoteId = null;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },{ urls: 'stun:stun2.l.google.com:19302' },
            ,{ urls: 'stun:stun3.l.google.com:19302' },{ urls: 'stun:stun4.l.google.com:19302' },

           {
                urls:'turn:free.expressturn.com:3478', // Tu servidor TURN
                username: '000000002102154901',
                credential: 'zTwHEShFvegqotlDMnVBLEt7pTo=',
            }
    ]
};

        // Desbloquear audio del navegador al primer toque o clic del usuario
        window.addEventListener('click', () => {
            if (remoteVideo.paused) {
                remoteVideo.play().catch(() => {});
            }
        }, { once: true });

        // Captura de cámara y micrófono con cancelación de eco avanzada
        navigator.mediaDevices.getUserMedia({ 
            video: true, 
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            } 
        })
        .then(stream => {
            localStream = stream;
            localVideo.srcObject = stream;
            socket.emit('ready-to-chat');
            
            // Respaldo de vídeo por socket si la red bloquea WebRTC
            setInterval(() => {
                if (remoteVideo.paused && localVideo.readyState === localVideo.HAVE_ENOUGH_DATA) {
                    const canvas = document.getElementById('canvas');
                    canvas.width = 160;
                    canvas.height = 120;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(localVideo, 0, 0, canvas.width, canvas.height);
                    socket.emit('video-frame', canvas.toDataURL('image/jpeg', 0.5));
                }
            }, 250);
        })
        .catch(err => console.error("Error al acceder a la webcam o micrófono:", err));

        socket.on('video-frame', (data) => {
            if (remoteVideo.paused || !remoteVideo.srcObject) {
                remoteImageFallback.style.display = 'block';
                remoteImageFallback.src = data;
            }
        });

        function createPeerConnection(target) {
            if (peerConnection) return;
            remoteId = target;
            peerConnection = new RTCPeerConnection(rtcConfig);
            
            // IMPORTANTE: Añadir tanto la pista de vídeo como la de audio al canal P2P
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
            
            // Recibir el flujo remoto (vídeo + audio)
            peerConnection.ontrack = (event) => {
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    remoteVideo.play().catch(() => {});
                    remoteImageFallback.style.display = 'none';
                }
            };
            
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) socket.emit('ice-candidate', { candidate: event.candidate, target: remoteId });
            };
        }

        socket.on('make-initiator', async (target) => {
            createPeerConnection(target);
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', { offer, target });
        });

        socket.on('offer', async (data) => {
            createPeerConnection(data.sender);
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', { answer, target: data.sender });
        });

        socket.on('answer', async (data) => {
            if (peerConnection && peerConnection.signalingState !== 'stable') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        });

        socket.on('ice-candidate', async (data) => {
            if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        });

        // --- GESTIÓN DE CHAT ---
        function appendMessage(text, senderName = 'Tú') {
            const chat = document.getElementById('chatSection');
            const msg = document.createElement('div');
            const isMe = senderName === 'Tú';
            msg.className = `message ${isMe ? 'outgoing' : 'incoming'}`;
            msg.innerText = isMe ? text : `${senderName}: ${text}`;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            if (!input.value.trim()) return;
            socket.emit('chat-message', { type: 'text', content: input.value });
            appendMessage(input.value, 'Tú');
            input.value = '';
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        function sendMedia(type) {
            let label = type === 'sticker' ? "👾 [Sticker]" : type === 'video' ? "🎬 [Vídeo]" : "🎤 [Audio]";
            socket.emit('chat-message', { type, content: label });
            appendMessage(label, 'Tú');
        }

        socket.on('chat-message', (data) => {
            appendMessage(data.content, data.sender);
        });
    </script>
</body>
</html>
