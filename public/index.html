<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pirulo de Xavi - Live Studio</title>
    


    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor Principal tipo Tarjeta Premium */
        .app-container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            background: #111827;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* Cabecera Estética */
        .app-header {
            padding: 16px 20px;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .live-badge {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* --- SECCIÓN DE CÁMARAS (Local principal + Remota superpuesta) --- */
        .camera-section {
            position: relative;
            width: 100%;
            height: 38vh;
            background: #000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #1a1a1a;
        }
        #remoteVideo {
            position: absolute;
            bottom: 14px;
            right: 14px;
            width: 115px;
            height: 155px;
            object-fit: cover;
            border: 2px solid #f59e0b;
            border-radius: 12px;
            background: #222;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            z-index: 10;
        }
        .remote-label {
            position: absolute;
            bottom: 150px;
            right: 14px;
            background: rgba(245, 158, 11, 0.9);
            color: #0b0f19;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 4px;
            z-index: 11;
            text-transform: uppercase;
        }

        /* --- SECCIÓN DE CHAT --- */
        .chat-section {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #0f172a;
        }
        .message {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 0.85rem;
            word-break: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .message.incoming {
            background: #1e293b;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .message.outgoing {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0b0f19;
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        /* --- CONTROLES Y ENTRADA --- */
        .controls-section {
            padding: 12px 16px;
            background: #111827;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .media-buttons {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .media-buttons button {
            flex: 1;
            background: #1f2937;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            padding: 8px 6px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .media-buttons button:hover {
            background: #374151;
            color: #fff;
            border-color: #f59e0b;
        }
        .chat-input-bar {
            display: flex;
            gap: 8px;
        }
        .chat-input-bar input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #1f2937;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-bar input:focus {
            border-color: #f59e0b;
        }
        .chat-input-bar button {
            padding: 10px 18px;
            background: #f59e0b;
            border: none;
            color: #0b0f19;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }
        .chat-input-bar button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Cabecera -->
        <header class="app-header">
            <h1 class="app-title">🍸 El Pirulo de Xavi</h1>
            <span class="live-badge">● En Vivo</span>
        </header>

        <!-- 1. Cámaras: Local de fondo y Remota flotante superpuesta -->
        <div class="camera-section">
            <video id="localVideo" autoplay playsinline muted></video>
            <span class="remote-label">Remota</span>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <!-- 2. Historial de Chat -->
        <div class="chat-section" id="chatSection">
            <div class="message incoming">¡Bienvenidos a El Pirulo de Xavi! Sistema en línea. 🚀</div>
        </div>

        <!-- 3. Controles Multimedia y Chat -->
        <div class="controls-section">
            <div class="media-buttons">
                <button onclick="sendMedia('sticker')">👾 Sticker</button>
                <button onclick="sendMedia('video')">🎬 Vídeo</button>
                <button onclick="sendMedia('audio')">🎤 Audio</button>
            </div>
            <div class="chat-input-bar">
                <input type="text" id="messageInput" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

   
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    let localStream;
    let peerConnection;
    let isInitiator = false;
    const rtcConfig = {
    iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' },
        { urls: 'stun:stun4.l.google.com:19302' },


          { 
                urls:'turn:free.expressturn.com:3478', // Tu servidor TURN
                username: '000000002102154901',
                credential: 'zTwHEShFvegqotlDMnVBLEt7pTo='
            }
    ]
};



          
   


    // 1. Obtener la cámara local primero
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
            localStream = stream;
            localVideo.srcObject = stream;
            
            // Una vez lista la cámara, avisamos al servidor
            socket.emit('ready-to-chat');
        })
        .catch(err => console.error("Error al acceder a la webcam local:", err));

    function createPeerConnection() {
        if (peerConnection) return;
        
        peerConnection = new RTCPeerConnection(rtcConfig);

        // Añadir pistas locales
        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

        // Recibir el vídeo remoto
        peerConnection.ontrack = (event) => {
            console.log("¡Vídeo remoto recibido!");
            if (remoteVideo.srcObject !== event.streams[0]) {
                remoteVideo.srcObject = event.streams[0];
            }
        };

        // Enviar candidatos ICE
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('ice-candidate', event.candidate);
            }
        };
    }

    // --- CONTROL DE SEÑALIZACIÓN SIN COLISIONES ---
    
    socket.on('make-initiator', async () => {
        isInitiator = true;
        createPeerConnection();
        try {
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', offer);
        } catch (e) {
            console.error("Error creando oferta:", e);
        }
    });

    socket.on('offer', async (offer) => {
        createPeerConnection();
        try {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer);
        } catch (e) {
            console.error("Error procesando oferta:", e);
        }
    });

    socket.on('answer', async (answer) => {
        try {
            if (peerConnection && peerConnection.signalingState !== 'stable') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            }
        } catch (e) {
            console.error("Error procesando respuesta:", e);
        }
    });

    socket.on('ice-candidate', async (candidate) => {
        if (peerConnection) {
            try {
                await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            } catch (e) {
                console.error('Error al añadir ICE candidate', e);
            }
        }
    });

    // --- CHAT Y MULTIMEDIA ---
    function appendMessage(text, type = 'outgoing') {
        const chat = document.getElementById('chatSection');
        const msg = document.createElement('div');
        msg.className = `message ${type}`;
        msg.innerText = text;
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('messageInput');
        if (input.value.trim() === '') return;
        
        socket.emit('chat-message', { type: 'text', content: input.value });
        appendMessage(input.value, 'outgoing');
        input.value = '';
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function sendMedia(type) {
        let label = '';
        if (type === 'sticker') label = "👾 [Sticker enviado]";
        if (type === 'video') label = "🎬 [Vídeo enviado]";
        if (type === 'audio') label = "🎤 [Nota de voz enviada]";

        socket.emit('chat-message', { type: type, content: label });
        appendMessage(label, 'outgoing');
    }

    socket.on('chat-message', (data) => {
        appendMessage(`${data.sender || 'Remoto'}: ${data.content}`, 'incoming');
    });
</script>
</body>
</html>
